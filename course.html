<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花藝體驗課程｜Multiverse Garden</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=41">
  <link rel="stylesheet" href="css/base.css?v=41">
  <link rel="stylesheet" href="css/components.css?v=41">
  <link rel="stylesheet" href="css/pages/course.css?v=41">
</head>
<body data-page="course">
  <div data-mg="header" data-variant="left" data-group="service" data-chip="course"></div>

  <main id="main" class="page-course">
    <div class="co-page">
      <h1 class="visually-hidden">花藝體驗課程</h1>

      <!-- 課程預約與付款（欄位、面板樣式沿用結帳頁 checkout.css）
           展示用表單：欄位刻意不設 name，資料不會進網址、不送出；卡號、安全碼不儲存 -->
      <form class="co-form" id="course-form">
        <div class="co-columns">

          <div class="co-col">
            <section class="co-panel" aria-labelledby="cs-info-title">
              <h2 class="co-panel__title" id="cs-info-title">課程資訊</h2>
              <dl class="cs-info">
                <div class="cs-info__row"><dt>課程名稱</dt><dd>花藝體驗課程</dd></div>
                <div class="cs-info__row"><dt>上課地點</dt><dd>Multiverse Garden 門市（1F 132, Daan street, Daan, Taipei, Taiwan）</dd></div>
                <div class="cs-info__row"><dt>課程時間</dt><dd>每堂約 2 小時</dd></div>
                <div class="cs-info__row"><dt>課程費用</dt><dd>NT$ 1800 / 人（含花材與花器）</dd></div>
              </dl>
            </section>

            <section class="co-panel" id="booking" aria-labelledby="cs-booking-title">
              <h2 class="co-panel__title" id="cs-booking-title">預約資訊</h2>
              <div class="co-fields">
                <div class="co-field">
                  <label class="co-field__label" for="cs-name">參加者姓名</label>
                  <input class="co-input" id="cs-name" type="text" autocomplete="name" required>
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-tel">聯絡電話</label>
                  <input class="co-input" id="cs-tel" type="tel" inputmode="tel" autocomplete="tel" required
                         pattern="(?=(?:[^0-9]*[0-9]){8})\+?[0-9\(\)\- ]{8,20}" data-hint="請輸入有效的電話號碼，例如 0912345678">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-email">Email</label>
                  <input class="co-input" id="cs-email" type="email" autocomplete="email" required spellcheck="false">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-date">課程日期</label>
                  <input class="co-input" id="cs-date" type="date" required data-min-days="1">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-slot">課程時段</label>
                  <span class="co-select">
                    <select class="co-input co-select__control" id="cs-slot" required>
                      <option value="" disabled selected hidden>請選擇</option>
                      <option>10:00–12:00</option>
                      <option>13:00–15:00</option>
                      <option>15:00–17:00</option>
                      <option>17:00–19:00</option>
                    </select>
                    <svg viewBox="0 0 11.3131 6.88332" fill="none" aria-hidden="true" focusable="false"><line x1="0.5" y1="-0.5" x2="8" y2="-0.5" transform="matrix(0.664138 0.74761 -0.664138 0.74761 0 0.52864)" stroke="currentColor" stroke-linecap="round"/><line x1="0.5" y1="-0.5" x2="8" y2="-0.5" transform="matrix(-0.664138 0.74761 0.664138 0.74761 11.3131 0.52864)" stroke="currentColor" stroke-linecap="round"/></svg>
                  </span>
                </div>
                <div class="co-field">
                  <span class="co-field__label" id="cs-qty-label">人數</span>
                  <div class="co-qty cs-qty" role="group" aria-labelledby="cs-qty-label">
                    <button class="co-qty__btn" type="button" data-step="-1" aria-label="減少人數" aria-disabled="true"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M4.375 9.375H15.625" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg></button>
                    <output class="co-qty__value" id="cs-qty" data-qty>1</output>
                    <button class="co-qty__btn" type="button" data-step="1" aria-label="增加人數"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M10 16.6667V10M10 10V3.33333M10 10H16.6667M10 10H3.33333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                  </div>
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-note">備註</label>
                  <input class="co-input" id="cs-note" type="text" autocomplete="off">
                </div>
              </div>
            </section>
          </div>

          <div class="co-col">
            <section class="co-panel" aria-labelledby="cs-payment-title">
              <h2 class="co-panel__title" id="cs-payment-title">付款資訊</h2>
              <div class="co-fields">
                <div class="co-field">
                  <label class="co-field__label" for="cs-pay-method">付款方式</label>
                  <span class="co-select">
                    <select class="co-input co-select__control" id="cs-pay-method">
                      <option>信用卡付款</option>
                    </select>
                    <svg viewBox="0 0 11.3131 6.88332" fill="none" aria-hidden="true" focusable="false"><line x1="0.5" y1="-0.5" x2="8" y2="-0.5" transform="matrix(0.664138 0.74761 -0.664138 0.74761 0 0.52864)" stroke="currentColor" stroke-linecap="round"/><line x1="0.5" y1="-0.5" x2="8" y2="-0.5" transform="matrix(-0.664138 0.74761 0.664138 0.74761 11.3131 0.52864)" stroke="currentColor" stroke-linecap="round"/></svg>
                  </span>
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-card-number">卡號</label>
                  <input class="co-input" id="cs-card-number" type="text" inputmode="numeric" autocomplete="cc-number" required
                         maxlength="23" spellcheck="false" pattern="(?:[0-9][ \-]?){12,18}[0-9]" data-hint="請輸入 13–19 位數字的卡號">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-card-name">持卡人姓名</label>
                  <input class="co-input" id="cs-card-name" type="text" autocomplete="cc-name" required spellcheck="false">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-card-exp">有效期（MM / YY）</label>
                  <input class="co-input" id="cs-card-exp" type="text" inputmode="numeric" autocomplete="cc-exp" required
                         maxlength="7" pattern="(?:0[1-9]|1[0-2]) ?\/? ?[0-9]{2}" data-hint="請依 MM / YY 格式輸入，例如 08 / 27">
                </div>
                <div class="co-field">
                  <label class="co-field__label" for="cs-card-cvc">安全碼</label>
                  <input class="co-input" id="cs-card-cvc" type="text" inputmode="numeric" autocomplete="cc-csc" required
                         maxlength="4" pattern="[0-9]{3,4}" data-hint="請輸入 3 或 4 位數字的安全碼">
                </div>

                <!-- 金額：人數 × 單價 = 合計 -->
                <dl class="co-totals cs-totals">
                  <div class="co-totals__row"><dt>課程費用</dt><dd><span data-unit-price>NT$ 1800</span> × <span data-qty-text>1</span> 人</dd></div>
                  <div class="co-totals__row co-totals__row--sum"><dt>合計</dt><dd data-grand-total aria-live="polite">NT$ 1800</dd></div>
                </dl>
              </div>
            </section>
          </div>
        </div>

        <div class="co-actions">
          <div class="text-links">
            <a class="text-link" href="products.html">繼續購物</a>
            <a class="text-link" href="#">訂閱我們</a>
          </div>
          <div class="co-actions__btns">
            <button class="btn btn--lg btn--ivory co-btn" type="submit">確認付款</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <div data-mg="footer"></div>

  <script src="js/icons.js?v=41"></script>
  <script src="js/data.js?v=41"></script>
  <script src="js/core.js?v=41"></script>
  <script src="js/pages/course.js?v=41"></script>
</body>
</html>
