      <!-- 上半（Figma「Frame 202」270:8942）：左夜景大圖｜右標題、說明與白天大圖 -->
      <div class="case-intro">
        <figure class="case-intro__main">
          <img src="https://pub-6b1a46631bc645beb6f95ed1a98d6997.r2.dev/img/case/popup-night.jpg" alt="夜晚的街角建築外牆上，銀色氣球與藍色霓虹燈管組成的聖誕快閃植物裝置" width="1200" height="1800" fetchpriority="high">
        </figure>

        <div class="case-intro__side">
          <div class="case-info">
            <h1 class="case-info__title">Christmas Pop-up</h1>
            <div class="case-info__body prose">
              <h2 class="prose__title">{ 商業佈置 }</h2>
              <p>2024 12 聖誕節快閃植物裝置藝術</p>
              <p>尺寸：約 H5 ×3 W m</p>
              <p>材質：植物與異材質結合、乾燥花材、混合媒材</p>
              <div class="prose__gap" aria-hidden="true"></div>
              <h2 class="prose__title">{ 價格預算 }</h2>
              <p>NT 200,000 元</p>
              <p>因場地大小與製作手法不同，僅供案件預算範圍參考，<br>待詳細討論後實際製作與報價。</p>
            </div>
          </div>

          <figure class="case-intro__sub">
            <img src="https://pub-6b1a46631bc645beb6f95ed1a98d6997.r2.dev/img/case/popup-day.jpg" alt="白天的街角建築外牆，懸掛著銀色氣球與深藍色枝材交織的裝置" width="828" height="1444" loading="lazy">
          </figure>
        </div>
      </div>

      <!-- 細節圖（Figma「card」270:8930）：4 張滿版、無間距 -->

        <li class="case-details__item"><img src="https://pub-6b1a46631bc645beb6f95ed1a98d6997.r2.dev/img/case/popup-detail-2.jpg" alt="裝置細節：霓虹燈字、深色枝材與銀色氣球" width="720" height="1080" loading="lazy"></li>
        <li class="case-details__item"><img src="https://pub-6b1a46631bc645beb6f95ed1a98d6997.r2.dev/img/case/popup-detail-3.jpg" alt="裝置細節：藍色燈光映照下層疊的銀色氣球" width="720" height="1080" loading="lazy"></li>
        <li class="case-details__item"><img src="https://pub-6b1a46631bc645beb6f95ed1a98d6997.r2.dev/img/case/popup-detail-4.jpg" alt="裝置細節：彎曲的銀色氣球管與藍色流蘇" width="720" height="1080" loading="lazy"></li>
